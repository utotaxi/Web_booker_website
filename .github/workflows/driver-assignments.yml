name: UTO driver-assignment emails

# Pings /api/cron/driver-assignments every 5 minutes so the rider receives
# the driver_assigned email within ~5 minutes of a driver being assigned or
# accepting a ride (status='assigned' or 'driver_accepted' with a driver_id).
# The endpoint is idempotent (dedupes per (booking, driver) pair), so running
# it frequently is safe. See DEPLOYMENT.md §9.5.
#
# Requires two repository secrets:
#   CRON_SECRET  — same value as the Fly app's CRON_SECRET env var.
#   APP_DOMAIN   — e.g. "uto-web-booker.fly.dev" (no scheme, no trailing slash).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger driver-assignment notifier
        run: |
          curl -fsS -X GET \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://${{ secrets.APP_DOMAIN }}/api/cron/driver-assignments"
